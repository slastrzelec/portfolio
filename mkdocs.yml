site_name: Portfolio - Sławomir Strzelec
site_url: https://slastrzelec.github.io/portfolio/
site_description: AI/ML Engineer portfolio of Sławomir Strzelec - RAG systems, LLM agents, computer vision and scientific ML. Tested, containerized, publicly deployed projects.
site_author: Sławomir Strzelec
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - About Me : o-mnie.md
  - Projects:
      - Selected projects:
          - 💡 Carbon Nanotubes RAG System (FastAPI · Docker · FAISS · RAGAs): carbon-nanotubes-rag/index.md
          - 🔌 Carbon Nanotubes RAG over MCP (MCP · LangGraph · Agent evaluation): carbon-nanotubes-rag-mcp/index.md
          - ☁️ GadAround on Google Cloud (Cloud Run · Cloud SQL · GitHub Actions · Cloudflare): gadaround-gcp-deployment/index.md
          - 🛡️ ML Data Guard (Data validation · Fault-injection benchmark · CI): ml-data-guard/index.md
      - More AI and ML:
          - 🔍 SEM Nanostructure Classifier (PyTorch · ConvNeXt · Leakage-free evaluation): sem-nanostructure-classifier/index.md
          - 🏺 Cuneiform Sign Classifier (PyTorch · Grad-CAM · HF Hub): 20_cuneiform-sign-classifier/index.md
          - 🤖 Scientific Research Agent (LangChain · LangGraph · LangFuse): research-agent-langchain/index.md
          - 🎯 CV-Job Matching System (OpenAI embeddings · Streamlit): cv-job-matcher/index.md
          - ⚡ KDB+/Q vs SQL Benchmark (kdb+/q · DuckDB · AWS · Prophet): energy-forecasting-sql-vs-kdb/index.md
      - 🖼️ Computer Vision:
          - 🔬 Erythrocyte Analysis (OpenCV · Streamlit): erythrocyte-shape-analyzer/index.md
          - 🚶 People Counter (YOLOX-nano · ONNX Runtime · ByteTrack): people-counter-yolox/index.md
          - 😊 Emotion Recognition (PyTorch · ResNet18 · OpenCV · Streamlit): emotion-recognition-cv/index.md
      - 🧪 Cheminformatics & Scientific ML:
          - 🧪 Buchwald-Hartwig C-N Coupling Optimizer (RDKit · XGBoost): buchwald-hartwig-optimizer/index.md
          - 💊 Drug Solubility Predictor (RDKit · scikit-learn): drug-solubility-prediction/index.md
          - 🧬 logP Predictor (PyTorch): molecular-lipophilicity-ai/index.md
      - 🔧 Other Projects:
          - 🌈 Raman Spectroscopy Analyzer (SciPy · Plotly): raman-spectroscopy-analyzer/index.md
          - ⛓️ Carbon Nanotube Visualizer (Plotly · ASE · Streamlit): carbon-nanotube-visualizer/index.md
  - Training & Courses: certificates.md
