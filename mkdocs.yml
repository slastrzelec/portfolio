site_name: Portfolio - Sławomir Strzelec
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  palette:
    scheme: default
    primary: deep orange
    accent: orange
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - About Me : o-mnie.md
  - Projects:
      - 🌟 Featured Projects:
          - 💡 Carbon Nanotubes RAG System (FastAPI · Docker · FAISS · RAGAs): 13_RAG_raman/index.md
          - 🏺 Cuneiform Sign Classifier (PyTorch · Grad-CAM · HF Hub): 20_cuneiform-sign-classifier/index.md
          - 🤖 Scientific Research Agent (LangChain · LangGraph · LangFuse): 17_research-agent-langchain/index.md
          - 🎯 CV-Job Matching System (OpenAI API · REST API): 18_cv-matching-openai-embeddings/index.md
          - 🫁 Pneumonia Detection (TensorFlow · Keras): 15_TensorFlow/index.md
          - ⚡ KDB+/Q vs SQL Benchmark (kdb+/q · DuckDB · AWS · Prophet): 08_AWS_Energy/index.md
      - 🖼️ Computer Vision:
          - 😊 Emotion Recognition System (OpenCV · PyTorch): 12_emotion-detection/index.md
          - 👥 Person Counter (OpenCV · Streamlit): 16_person_counter/index.md
          - 🔬 Erythrocyte Analysis (OpenCV · Streamlit): erythrocyte-shape-analyzer/index.md
      - 🧪 Cheminformatics & Scientific ML:
          - 🧪 Buchwald-Hartwig C-N Coupling Optimizer (RDKit · XGBoost): 06_reaction_opt/index.md
          - 💊 Drug Solubility Predictor (RDKit · scikit-learn): 05_drug_solub/index.md
          - 🧬 logP Predictor (PyTorch): 07_logP Predictor/index.md
      - 🔧 Other Projects:
          - 🌈 Raman Spectroscopy Analyzer (SciPy · Plotly): raman-spectroscopy-analyzer/index.md
          - ⛓️ Carbon Nanotube Visualizer (Plotly · ASE · Streamlit): carbon-nanotube-visualizer/index.md
  - Certificates: certificates.md
